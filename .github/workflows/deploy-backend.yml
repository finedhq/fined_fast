# Automated backend deployment to Heroku.
#
# Pushes the `fined_backend/` subdirectory (and nothing else) to the Heroku app
# on every push to `main` that touches backend files. Heroku builds it with the
# Python buildpack from fined_backend/requirements.txt and starts it with
# fined_backend/Procfile.
#
# ─── One-time setup ───────────────────────────────────────────────────────────
#
# 1. Create a long-lived Heroku API token. Use `authorizations:create`, NOT
#    `heroku auth:token` — the latter returns a short-lived token that expires
#    and will silently start failing your deploys:
#
#        heroku authorizations:create --description "GitHub Actions deploy"
#
#    Copy the value printed next to `Token`.
#
# 2. Add these repository secrets under:
#    GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#
#        HEROKU_API_KEY    the Token from step 1
#        HEROKU_EMAIL      the email address on your Heroku account
#        HEROKU_APP_NAME   fined-fast   (optional — falls back to `fined-fast`)
#
# 3. Runtime config (SUPABASE_URL, AUTH0_DOMAIN, SMTP_USER, ...) lives in Heroku
#    config vars, never in this repo — `fined_backend/.env` is gitignored and is
#    not deployed. If a required setting from app/config.py is missing the app
#    will crash on boot. Verify with:
#
#        heroku config --app fined-fast
#
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy backend to Heroku

on:
  push:
    branches: [main]
    paths:
      - "fined_backend/**"
  workflow_dispatch: # lets you re-run a deploy from the Actions tab without a new commit

# Queue deploys rather than running two `git push` builds at Heroku at once.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy fined_backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Deploying to Heroku is a git push, which needs the full history.
          fetch-depth: 0

      - name: Deploy fined_backend to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME || 'fined-fast' }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
        run: |
          cat > ~/.netrc <<EOF
          machine git.heroku.com
            login ${HEROKU_EMAIL:-_}
            password $HEROKU_API_KEY
          EOF
          git remote add heroku https://git.heroku.com/${HEROKU_APP_NAME}.git
          git push heroku $(git subtree split --prefix fined_backend HEAD):main --force
